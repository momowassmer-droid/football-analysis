# ByteTrack tuned for occlusion-heavy football footage.
# Compared to Ultralytics defaults: longer track_buffer so a player
# briefly hidden behind another doesn't immediately lose its ID.

tracker_type: bytetrack
track_high_thresh: 0.25
track_low_thresh: 0.1
new_track_thresh: 0.25
track_buffer: 90
match_thresh: 0.8
fuse_score: True
